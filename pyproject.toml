[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_canon"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/docs", "/mcp", "/requirements",
  "/README.md", "/LICENSE", "/CHANGELOG.md", "/SECURITY.md",
  "/VERSIONING.md", "/CONTRIBUTING.md", "/CODE_OF_CONDUCT.md",
  "/pyproject.toml",
]

[project]
name = "GeoCanon"
version = "1.0.0"
description = "Jurisdictions, dial codes, flags, ISO codes, timezones, holidays, languages, currencies, and address formats for Django, in one package."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["dial-codes", "django", "flags", "global", "holidays", "i18n", "internationalization", "jurisdiction", "l10n", "languages", "locale", "localization", "mcp", "timezones"]
authors = [
  { name = "Tunet Ltd", email = "alex@tunet.xyz" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Internationalization",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Localization",
  "Typing :: Typed",
]
dependencies = [
  "Django>=5.2.19,<7",
]

[project.optional-dependencies]
holidays = ["holidays>=0.107"]
timezones = ["pytz>=2026.6"]
phones = ["phonenumbers>=9.0.43"]
locale = ["Babel>=2.18.0"]
validation = ["pydantic>=2.14.3,<3"]
all = [
  "holidays>=0.107",
  "pytz>=2026.6",
  "phonenumbers>=9.0.43",
  "Babel>=2.18.0",
  "pydantic>=2.14.3,<3",
]
dev = [
  "bandit>=1.9.4",
  "build>=1.5",
  "pip-audit>=2.10.1",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.14.0",
  "mypy>=2.4.1",
  "ruff>=0.17.4",
  "django-stubs>=6.0.9",
  "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Tunet-xyz/geo_canon"
Product = "https://www.tunet.xyz/engineering/geo-canon/"
Documentation = "https://github.com/Tunet-xyz/geo_canon/blob/main/docs/README.md"
Repository = "https://github.com/Tunet-xyz/geo_canon"
Issues = "https://github.com/Tunet-xyz/geo_canon/issues"
Changelog = "https://github.com/Tunet-xyz/geo_canon/blob/main/CHANGELOG.md"

[project.scripts]
geocanon-mcp = "geo_canon.mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
pythonpath = [".", "src"]

[tool.mypy]
python_version = "3.10"
packages = ["geo_canon"]
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["geo_canon"]

[tool.coverage.run]
source = ["geo_canon"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
fail_under = 80
show_missing = true
