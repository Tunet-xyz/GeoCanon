name: Tests

on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1' && github.triggering_actor == 'bezu-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: {persist-credentials: false}
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[all,dev]
    
    - name: Lint
      run: |
        python -m ruff check src tests
    
    - name: Type check
      run: |
        python -m mypy src/geo_canon
    
    - name: Test
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/src
        pytest tests/ --cov=geo_canon --cov-branch --cov-report=term-missing
    
  minimum-dependencies:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1' && github.triggering_actor == 'bezu-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with: {persist-credentials: false}

    - name: Set up Python 3.10
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -c requirements/minimum.txt ".[all]" "pytest>=7.0.0" "pytest-django>=4.5.0" "tomli>=2"

    - name: Test
      run: |
        pytest tests/
